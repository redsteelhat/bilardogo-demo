<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı · BilardoGo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #f5f5f4; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-family: Georgia, serif; font-size: 24px; margin: 16px 0 6px; }
      p { color: #a3a3a3; font-size: 14px; }
      button { margin-top: 16px; background: #ee7b30; color: #0a0a0a; border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Salon ve masa durumu canlı olduğu için bağlantı gerekiyor.</p>
      <button onclick="location.reload()">Tekrar dene</button>
    </div>
  </body>
</html>
